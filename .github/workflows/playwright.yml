name: Playwright Tests

# Chromium-only e2e suite. Two failure modes to avoid:
#   1. `playwright install --with-deps` hung 15+ min on the apt step on these
#      runners (both this workflow and the old deploy one).
#   2. The official Playwright container (mcr.microsoft.com) intermittently
#      returns "unauthorized" on anonymous pulls.
# So we install only the chromium browser binary (from Playwright's CDN, no
# apt). GitHub's ubuntu-24.04 runners already ship the system libs chromium
# needs, so --with-deps isn't required.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Chromium
      run: npx playwright install chromium
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
