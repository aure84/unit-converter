name: Playwright Tests

# Runs inside the official Playwright container so chromium + all system libs
# are already present. A bare ubuntu runner + `playwright install --with-deps`
# hung for 15+ minutes on apt (same issue the deploy workflow hit). The image
# is pinned to the @playwright/test version in package.json.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    steps:
    - uses: actions/checkout@v6
    - name: Install dependencies
      run: npm ci
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
