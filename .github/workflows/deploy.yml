name: Deploy to Cloudflare

# Builds the site WITH the Playwright prerender step (which Cloudflare's own
# build environment can't run — it has no chromium) and deploys the result.
# This is a Workers + Static Assets project (wrangler.toml has an [assets]
# block, deployed via `wrangler deploy`), not a classic Pages project.
# Runs only on push to main or when triggered by hand.
#
# Runs inside the official Playwright container so chromium + all system libs
# are already present — `playwright install --with-deps` on a bare ubuntu runner
# was hanging on apt. The container image is pinned to the @playwright/test
# version in package.json.
#
# IMPORTANT: disconnect this project's Git integration in the Cloudflare
# dashboard (Workers & Pages → unit-converter → Settings → Build → Disconnect),
# otherwise CF also auto-builds on push and fails for lack of chromium.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build + prerender
        run: npm run build

      - name: Deploy to Cloudflare (Workers + Static Assets)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
