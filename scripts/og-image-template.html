<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #08060d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  .inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  .headline {
    font-size: 80px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -1px;
    line-height: 1;
  }
  .domain {
    font-size: 36px;
    font-weight: 400;
    color: #aa3bff;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="inner">
    <div class="headline">Convert Anything. Fast.</div>
    <div class="domain">convert-fast.com</div>
  </div>
</body>
</html>
